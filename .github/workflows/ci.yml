name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/incubator-release-assistant/scripts/ira
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: skills/incubator-release-assistant/scripts/ira/go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Smoke test Windows Skill wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: skills/incubator-release-assistant
        run: .\scripts\run.ps1 version
      - name: Smoke test Unix Skill wrapper
        if: runner.os != 'Windows'
        shell: bash
        working-directory: skills/incubator-release-assistant
        run: bash ./scripts/run.sh version

  repository-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Skill mirrors and metadata
        shell: pwsh
        run: .\scripts\validate-repository.ps1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
